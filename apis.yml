aid: vedantu
name: Vedantu
description: >-
  Vedantu is an Indian online-learning (edtech) company headquartered in
  Bangalore that delivers LIVE interactive classes, recorded courses, offline
  centres, and one-to-one tutoring for school students from Class 1 to 12 and
  competitive-exam aspirants, covering CBSE, ICSE, IGCSE and major State Boards
  plus JEE, NEET, CUET and Olympiad preparation, alongside a large free library
  of NCERT solutions, revision notes, sample papers and study material. Backed
  by Accel, Vedantu is consumer-facing and operates no public developer API
  today; its only published integration surface is a legacy External-Integration
  (EI) kit for institutes on GitHub, though it does publish an llms.txt for
  agents.
